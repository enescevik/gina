name: Security review
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '18 5 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/security-audit.mjs
      # Q03-LEAK-1: repo/rapor sızıntı taraması, bilgi amaçlı. Eşleşen değer yazılmaz (yalnız desen + dosya:satır);
      # bilinen yanlış pozitifler betikteki allowlist'te gerekçesiyle durur. İş akışını durdurmaz; özet iş sayfasına yazılır.
      - name: Leak scan (informational)
        continue-on-error: true
        run: node scripts/security/leak-scan.mjs --json leak-scan.json --summary "$GITHUB_STEP_SUMMARY"
