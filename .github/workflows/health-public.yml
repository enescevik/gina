name: Public production health
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor to run
        type: choice
        options: [health, security]
        default: health
  schedule:
    - cron: '43 */2 * * *'
    - cron: '18 7 * * 1'
permissions:
  contents: read
  actions: read
  security-events: read
concurrency:
  group: production-monitor
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ inputs.mode || (github.event.schedule == '18 7 * * 1' && 'security' || 'health') }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPO_PUBLIC_SUPABASE_URL: https://wixjxlxgyhgdacadsawo.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.MONITOR_SUPABASE_ANON_KEY }}
      MONITOR_SUPABASE_URL: https://wixjxlxgyhgdacadsawo.supabase.co
      CF_ACCESS_TEAM: ${{ vars.CF_ACCESS_TEAM || 'gina-family' }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_BACKOFFICE_PROJECT || 'gina-backoffice' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Load previous snapshot
        run: |
          artifact_run=$(gh api -X GET "repos/$GH_REPO/actions/artifacts" -f name="production-monitor-$MODE" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$artifact_run" ]; then
            gh run download "$artifact_run" -n "production-monitor-$MODE" -D previous-monitor
          fi
      - name: Read open CodeQL alerts
        if: env.MODE == 'security'
        run: gh api -X GET --paginate --slurp "repos/$GH_REPO/code-scanning/alerts" -f state=open -f ref=refs/heads/main -F per_page=100 | jq 'map(map({number}))' > security-alerts.json
      - name: Probe and compare
        run: node scripts/production-monitor.mjs "$MODE" previous-monitor/state.json state.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: production-monitor-${{ env.MODE }}
          path: state.json
          retention-days: 30
          if-no-files-found: error
      - name: Flag new incidents or security alerts once
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { opened, resolved } = JSON.parse(readFileSync("state.json", "utf8"));
            if (resolved.length) console.log("::notice::Recovered or closed: " + resolved.join(", "));
            if (opened.length) {
              console.error("::error::New findings: " + opened.join(", "));
              process.exitCode = 1;
            }'
