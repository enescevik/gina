# Veli webi (Expo web export) → Cloudflare Pages.
# Gerekli GitHub secret'ları: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY (bkz. docs/DEPLOY.md).
# Hiç kurulmamış push yayını atlanır; elle yayın veya kısmi yapılandırma hata verir.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - deploy/web/**
      - scripts/build-web.mjs
      - scripts/cf-pages-finalize.mjs
      - scripts/public-build-env.mjs
      - scripts/deploy-preflight.mjs
      - scripts/release-local.mjs
      - scripts/release-summary.mjs
      - scripts/health-check.mjs
      - scripts/check-testflight.mjs
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: expo export -p web + wrangler pages deploy
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_WEB_PROJECT || 'gina-web' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret kontrolü
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/deploy-preflight.mjs web
      - name: Yayın eşlemesi (commit/ref/run/sürüm/secret adları) → iş özeti
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/release-summary.mjs mapping web

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Bağımlılıklar
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm turbo run typecheck --filter=@gina/mobile...
      - name: expo export -p web + _headers/_redirects
        if: steps.secrets.outputs.ready == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/build-web.mjs
      - name: Cloudflare Pages'e yükle
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          # wrangler, @gina/backoffice devDependency'si olarak lockfile'da sabit; sürüm eşleşince
          # action yeniden kurmaz (pnpm workspace köküne `pnpm add` denemez).
          wranglerVersion: "4.156.0"
          packageManager: pnpm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mobile/dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
      - name: Canlı hash doğrulaması (yerel dist ↔ gina-web.pages.dev + dağıtım URL’si)
        id: verify
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/release-local.mjs verify --target web --execute --deployment-url "${{ steps.deploy.outputs.deployment-url }}"
      - name: Sağlık kontrolü (public/anon uçlar; kişisel veri yok)
        id: health
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/health-check.mjs --pretty
      - name: Yayın sonucu → iş özeti (atlanan iş başarı sayılmaz)
        if: always()
        env:
          READY: ${{ steps.secrets.outputs.ready }}
          OUTCOME: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: node scripts/release-summary.mjs result web
