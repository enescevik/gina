# Veli webi (Expo web export) → Cloudflare Pages.
# Gerekli GitHub secret'ları: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY (bkz. docs/DEPLOY.md).
# Secret'lar eksikse iş hata vermeden atlanır (uyarı yazar).
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - deploy/web/**
      - scripts/build-web.mjs
      - scripts/cf-pages-finalize.mjs
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: expo export -p web + wrangler pages deploy
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_WEB_PROJECT || 'gina-web' }}
    steps:
      - name: Secret kontrolü
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy web atlandı::Eksik secret'lar:$missing (docs/DEPLOY.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Bağımlılıklar
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm turbo run typecheck --filter=@gina/mobile...
      - name: expo export -p web + _headers/_redirects
        if: steps.secrets.outputs.ready == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/build-web.mjs
      - name: Cloudflare Pages'e yükle
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          # wrangler, @gina/backoffice devDependency'si olarak lockfile'da sabit; sürüm eşleşince
          # action yeniden kurmaz (pnpm workspace köküne `pnpm add` denemez).
          wranglerVersion: "4.156.0"
          packageManager: pnpm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mobile/dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
