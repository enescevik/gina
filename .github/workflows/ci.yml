name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - run: node --test scripts/check-testflight.test.mjs

  edge:
    name: Edge auth + account deletion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --config supabase/functions/deno.json supabase/functions/delete-account/index.ts supabase/functions/prova-generate/index.ts supabase/functions/prova-grade/index.ts supabase/functions/prova-plan/index.ts supabase/functions/iap-verify/index.ts supabase/functions/ai-weekly-summary/index.ts
      - run: deno test --config supabase/functions/deno.json supabase/functions/_shared/auth.test.ts supabase/functions/delete-account/handler.test.ts

  db:
    name: supabase migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Supabase CLI kök devDependency olarak sabitlenmiştir; GitHub API'ye "latest" sorgusu gerekmez.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase test db
