name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo install --check
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: "1"
      - run: pnpm turbo run lint typecheck test
      - run: node --test scripts/check-testflight.test.mjs scripts/check-native-text.test.mjs scripts/prepare-tablet-install.test.mjs scripts/check-notebook-layout.test.mjs scripts/check-projection-refresh.test.mjs scripts/check-answer-recovery.test.mjs scripts/check-realtime-readiness.test.mjs
      - run: node --test scripts/check-toolchain-security.test.mjs scripts/public-build-env.test.mjs scripts/deploy-preflight.test.mjs scripts/check-backoffice-access.test.mjs
      - run: node --test scripts/release-local.test.mjs scripts/health-check.test.mjs scripts/rollback.test.mjs scripts/release-summary.test.mjs
      - run: node scripts/check-auth-email-templates.mjs
      - run: python3 scripts/test-meb-scenarios.py
      - run: python3 scripts/test-curriculum-candidates.py
      - run: python3 scripts/test-curriculum-review.py
      - run: python3 scripts/test-learning-pilot.py
      - run: python3 scripts/test-library-import-preparer.py
      - run: python3 scripts/test-library-draft.py
      - run: python3 scripts/test-library-math6.py
      - run: python3 scripts/test-library-science6.py
      - run: python3 scripts/test-library-turkish5.py
      - run: python3 scripts/build-library-coverage.py --check

  edge:
    name: Edge auth, account deletion + weather
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --frozen-lockfile --config supabase/functions/deno.json supabase/functions/delete-account/index.ts supabase/functions/prova-generate/index.ts supabase/functions/prova-grade/index.ts supabase/functions/prova-plan/index.ts supabase/functions/iap-verify/index.ts supabase/functions/ai-weekly-summary/index.ts supabase/functions/room-weather/index.ts supabase/functions/setup-suggestions/index.ts supabase/functions/learning-source/index.ts supabase/functions/source-cleanup/index.ts supabase/functions/timetable-import/index.ts supabase/functions/learning-plan-import/index.ts supabase/functions/ai-preflight/index.ts supabase/functions/prova-review/index.ts supabase/functions/contribution-submit/index.ts supabase/functions/apple-notifications/index.ts supabase/functions/google-rtdn/index.ts supabase/functions/iap-reconcile/index.ts supabase/functions/iap-operator-reconcile/index.ts supabase/functions/push-send/index.ts supabase/functions/channel-unsubscribe/index.ts scripts/isolated-source-edge.ts supabase/functions/curriculum-source-fetch/index.ts supabase/functions/content-prereview/index.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json supabase/functions/ai-preflight/handler.test.ts supabase/functions/ai-preflight/feature-smoke.test.ts supabase/functions/ai-weekly-summary/handler.test.ts supabase/functions/_shared/ai-operation.test.ts supabase/functions/_shared/store-notification.test.ts supabase/functions/_shared/answer-notebook.test.ts supabase/functions/_shared/timetable-extraction.test.ts supabase/functions/_shared/learning-plan-extraction.test.ts supabase/functions/learning-plan-import/handler.test.ts supabase/functions/_shared/source-file.test.ts supabase/functions/_shared/question-images.test.ts supabase/functions/_shared/library-source.test.ts supabase/functions/_shared/auth.test.ts supabase/functions/_shared/prereview.test.ts supabase/functions/content-prereview/handler.test.ts supabase/functions/content-prereview/auth.test.ts supabase/functions/_shared/setup-drafts.test.ts supabase/functions/_shared/blueprint-plan.test.ts supabase/functions/_shared/catalogue-plan.test.ts supabase/functions/_shared/generation-result.test.ts supabase/functions/_shared/structured-generation.test.ts supabase/functions/_shared/question-structure.test.ts supabase/functions/_shared/prova-generation-scope.test.ts supabase/functions/setup-suggestions/handler.test.ts supabase/functions/_shared/grade-report.test.ts supabase/functions/_shared/answer-key.test.ts supabase/functions/delete-account/handler.test.ts supabase/functions/room-weather/handler.test.ts supabase/functions/_shared/curriculum-source.test.ts supabase/functions/curriculum-source-fetch/handler.test.ts supabase/functions/_shared/ai-route.test.ts supabase/functions/_shared/ai-provider.test.ts

      - run: deno test --frozen-lockfile --config supabase/functions/deno.json --allow-env=APPLE_BUNDLE_ID supabase/functions/_shared/iap-state.test.ts supabase/functions/iap-operator-reconcile/handler.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json supabase/functions/_shared/prova-document.test.ts supabase/functions/_shared/auth-access.test.ts supabase/functions/learning-source/handler.test.ts supabase/functions/timetable-import/handler.test.ts supabase/functions/push-send/messages.test.ts supabase/functions/push-send/handler.test.ts supabase/functions/push-send/providers.test.ts supabase/functions/push-send/channels.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json --allow-net=127.0.0.1 supabase/functions/_shared/channels/email.test.ts supabase/functions/_shared/channels/sms.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json supabase/functions/channel-unsubscribe/handler.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json --allow-net=127.0.0.1 --allow-run=openssl --allow-read --allow-write --allow-env supabase/functions/_shared/channels/email-tls.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json supabase/functions/library-media/png.test.ts supabase/functions/library-media/handler.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json --allow-read=supabase/functions/prova-review/assets supabase/functions/_shared/review-report.test.ts supabase/functions/_shared/review-renderer.test.ts supabase/functions/prova-review/handler.test.ts supabase/functions/contribution-submit/handler.test.ts
      # H02: Deno extractor parity (golden from scripts/test-meb-extract-parity.py) + panel extraction handler.
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json --allow-read=docs/learning/catalog/2026-2027-term1/sources,supabase/functions/_shared supabase/functions/_shared/meb-extract.test.ts supabase/functions/curriculum-source-extract/handler.test.ts

  db:
    name: supabase migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Supabase CLI kök devDependency olarak sabitlenmiştir; GitHub API'ye "latest" sorgusu gerekmez.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      # Q02-10: pgTAP dosyaları `current_date` ile aile saat dilimindeki (Europe/Istanbul) fonksiyonlara
      # 'bugün' verir; yerel test DB'si UTC iken 21:00-24:00 UTC koşuları gün kaydırır. Yalnız CI'nin
      # geçici yerel DB'si hizalanır (üretim/şema değişmez; config.toml [db.settings] timezone anahtarı tanımaz).
      - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -v ON_ERROR_STOP=1 -c "alter database postgres set timezone to 'Europe/Istanbul';"
      - run: pnpm exec supabase test db
