name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo install --check
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: "1"
      - run: pnpm turbo run lint typecheck test
      - run: node --test scripts/check-testflight.test.mjs scripts/check-native-text.test.mjs scripts/prepare-tablet-install.test.mjs scripts/check-notebook-layout.test.mjs
      - run: python3 scripts/test-meb-scenarios.py
      - run: python3 scripts/test-curriculum-candidates.py
      - run: python3 scripts/test-learning-pilot.py
      - run: python3 scripts/test-library-import-preparer.py
      - run: python3 scripts/test-library-draft.py
      - run: python3 scripts/build-library-coverage.py --check

  edge:
    name: Edge auth, account deletion + weather
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --frozen-lockfile --config supabase/functions/deno.json supabase/functions/delete-account/index.ts supabase/functions/prova-generate/index.ts supabase/functions/prova-grade/index.ts supabase/functions/prova-plan/index.ts supabase/functions/iap-verify/index.ts supabase/functions/ai-weekly-summary/index.ts supabase/functions/room-weather/index.ts supabase/functions/setup-suggestions/index.ts supabase/functions/learning-source/index.ts supabase/functions/source-cleanup/index.ts supabase/functions/timetable-import/index.ts supabase/functions/ai-preflight/index.ts supabase/functions/prova-review/index.ts supabase/functions/apple-notifications/index.ts supabase/functions/google-rtdn/index.ts supabase/functions/iap-reconcile/index.ts supabase/functions/iap-operator-reconcile/index.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json supabase/functions/ai-preflight/handler.test.ts supabase/functions/_shared/ai-operation.test.ts supabase/functions/_shared/store-notification.test.ts supabase/functions/_shared/answer-notebook.test.ts supabase/functions/_shared/timetable-extraction.test.ts supabase/functions/_shared/source-file.test.ts supabase/functions/_shared/question-images.test.ts supabase/functions/_shared/library-source.test.ts supabase/functions/_shared/auth.test.ts supabase/functions/_shared/setup-drafts.test.ts supabase/functions/_shared/grade-report.test.ts supabase/functions/delete-account/handler.test.ts supabase/functions/room-weather/handler.test.ts

      - run: deno test --frozen-lockfile --config supabase/functions/deno.json --allow-env=APPLE_BUNDLE_ID supabase/functions/_shared/iap-state.test.ts supabase/functions/iap-operator-reconcile/handler.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json supabase/functions/_shared/prova-document.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json supabase/functions/library-media/png.test.ts supabase/functions/library-media/handler.test.ts
      - run: deno test --frozen-lockfile --config supabase/functions/deno.json --allow-read=supabase/functions/prova-review/assets supabase/functions/_shared/review-report.test.ts supabase/functions/_shared/review-renderer.test.ts supabase/functions/prova-review/handler.test.ts

  db:
    name: supabase migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Supabase CLI kök devDependency olarak sabitlenmiştir; GitHub API'ye "latest" sorgusu gerekmez.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase test db
