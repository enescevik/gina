# Backoffice (statik Next.js admin) → Cloudflare Pages (Cloudflare Access arkasında).
# Gerekli GitHub secret'ları: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (bkz. docs/DEPLOY.md).
# Hiç kurulmamış push yayını atlanır; elle yayın veya kısmi yapılandırma hata verir.
name: Deploy backoffice

on:
  push:
    branches: [main]
    paths:
      - apps/backoffice/**
      - packages/api/**
      - packages/core/**
      - packages/config/**
      - deploy/backoffice/**
      - scripts/build-backoffice.mjs
      - scripts/cf-pages-finalize.mjs
      - scripts/public-build-env.mjs
      - scripts/deploy-preflight.mjs
      - scripts/check-backoffice-access.mjs
      - scripts/release-summary.mjs
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-backoffice.yml
  workflow_dispatch:

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: next build (export) + wrangler pages deploy
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_BACKOFFICE_PROJECT || 'gina-backoffice' }}
      CF_ACCESS_TEAM: ${{ vars.CF_ACCESS_TEAM || 'gina-family' }}
    steps:
      - uses: actions/checkout@v7
      - name: Secret kontrolü
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/deploy-preflight.mjs backoffice
      - name: Yayın eşlemesi (commit/ref/run/sürüm/secret adları) → iş özeti
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/release-summary.mjs mapping backoffice

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Bağımlılıklar
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm turbo run typecheck lint --filter=@gina/backoffice
      - name: next build + _headers
        if: steps.secrets.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/build-backoffice.mjs
      - name: Üretim ve önizleme Access kapısını doğrula
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/check-backoffice-access.mjs
      - name: Cloudflare Pages'e yükle
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          # wrangler, @gina/backoffice devDependency'si olarak lockfile'da sabit; sürüm eşleşince
          # action yeniden kurmaz (pnpm workspace köküne `pnpm add` denemez).
          wranglerVersion: "4.156.0"
          packageManager: pnpm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/backoffice/out --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
      - name: Yayın sonrası Access kapısını doğrula (ana adres + gerçek dağıtım URL’si)
        id: access
        if: steps.secrets.outputs.ready == 'true'
        env:
          CF_PREVIEW_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/check-backoffice-access.mjs
      - name: Yayın sonucu → iş özeti (atlanan iş başarı sayılmaz)
        if: always()
        env:
          READY: ${{ steps.secrets.outputs.ready }}
          OUTCOME: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ACCESS_OUTCOME: ${{ steps.access.outcome }}
        run: node scripts/release-summary.mjs result backoffice
