# Backoffice (statik Next.js admin) → Cloudflare Pages (Cloudflare Access arkasında).
# Gerekli GitHub secret'ları: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (bkz. docs/DEPLOY.md).
# Secret'lar eksikse iş hata vermeden atlanır (uyarı yazar).
name: Deploy backoffice

on:
  push:
    branches: [main]
    paths:
      - apps/backoffice/**
      - packages/api/**
      - packages/core/**
      - packages/config/**
      - deploy/backoffice/**
      - scripts/build-backoffice.mjs
      - scripts/cf-pages-finalize.mjs
      - pnpm-lock.yaml
      - .github/workflows/deploy-backoffice.yml
  workflow_dispatch:

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: next build (export) + wrangler pages deploy
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_BACKOFFICE_PROJECT || 'gina-backoffice' }}
    steps:
      - name: Secret kontrolü
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy backoffice atlandı::Eksik secret'lar:$missing (docs/DEPLOY.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Bağımlılıklar
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm turbo run typecheck lint --filter=@gina/backoffice
      - name: next build + _headers
        if: steps.secrets.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/build-backoffice.mjs
      - name: Cloudflare Pages'e yükle
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          # wrangler, @gina/backoffice devDependency'si olarak lockfile'da sabit; sürüm eşleşince
          # action yeniden kurmaz (pnpm workspace köküne `pnpm add` denemez).
          wranglerVersion: "4.156.0"
          packageManager: pnpm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/backoffice/out --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
