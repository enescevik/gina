<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img"><title>Oyun buluşması afişi</title><desc>Afişte “Birlikte Oynayalım”, “Cumartesi”, “14.30”, “Okul bahçesi” ve “Bir oyun öner, birlikte dene.” yazıyor. Ortada bir zar ve birbirine geçen iki yapboz parçası var. Fiyat veya ücret bilgisi yok.</desc><rect width="600" height="750" fill="#FFFDF8"/><rect x="20" y="20" width="560" height="710" rx="24" fill="#F1EBFA" stroke="#6442DA" stroke-width="3"/><text x="300" y="94" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">BİRLİKTE OYNAYALIM</text><g data-symbol="dice"><rect x="100" y="150" width="160" height="160" rx="24" fill="#FFFFFF" stroke="#6442DA" stroke-width="3"/><circle cx="140" cy="190" r="10" fill="#6442DA" /><circle cx="220" cy="190" r="10" fill="#6442DA" /><circle cx="180" cy="230" r="10" fill="#6442DA" /><circle cx="140" cy="270" r="10" fill="#6442DA" /><circle cx="220" cy="270" r="10" fill="#6442DA" /></g><g data-symbol="puzzle"><path d="M 330 150 H 400 V 190 C 440 170 440 230 400 210 V 250 H 330 Z" fill="#52BFA8" stroke="#201951" stroke-width="3"/><path d="M 400 150 H 470 V 250 H 400 V 210 C 440 230 440 170 400 190 Z" fill="#D9CEF4" stroke="#201951" stroke-width="3"/></g><text x="300" y="395" text-anchor="middle" fill="#201951" font-size="42" font-family="Arial,sans-serif">Cumartesi</text><text x="300" y="450" text-anchor="middle" fill="#201951" font-size="46" font-family="Arial,sans-serif">14.30</text><text x="300" y="530" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">Okul bahçesi</text><text x="300" y="628" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Bir oyun öner, birlikte dene.</text></svg>
