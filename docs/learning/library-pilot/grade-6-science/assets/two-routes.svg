<svg xmlns="http://www.w3.org/2000/svg" width="860" height="530" viewBox="0 0 860 530" role="img"><title>Bahçedeki iki robot</title><desc>A solda, B sağdadır. Mor yol A’dan doğrudan sağdaki B’ye gider. Mint yol A’dan yukarıdaki C’ye, sağdaki D’ye, sonra aşağıdaki B’ye gider. Başlangıç ve bitiş noktaları ortaktır; mint yol daha uzundur.</desc><rect width="860" height="530" fill="#FFFDF8"/><path data-route="purple" d="M 140 400 L 720 400" fill="none" stroke="#6442DA" stroke-width="9"/><path data-route="mint" d="M 140 400 L 140 130 L 720 130 L 720 400" fill="none" stroke="#52BFA8" stroke-width="9"/><circle cx="140" cy="400" r="11" fill="#201951" data-point="A"/><text x="98" y="410" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">A</text><circle cx="720" cy="400" r="11" fill="#201951" data-point="B"/><text x="762" y="410" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">B</text><circle cx="140" cy="130" r="11" fill="#201951" data-point="C"/><text x="98" y="140" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">C</text><circle cx="720" cy="130" r="11" fill="#201951" data-point="D"/><text x="762" y="140" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">D</text><text x="430" y="81" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Mint: A–C–D–B</text><text x="430" y="365" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Mor: A–B</text><text x="430" y="490" text-anchor="middle" fill="#201951" font-size="27" font-family="Arial,sans-serif">Aynı başlangıç ve bitiş · Eşit toplam süre</text></svg>
