<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img"><title>Işık ve gölge modeli</title><desc>K satırında soldan sağa Güneş, Ay, Dünya; L satırında soldan sağa Güneş, Dünya, Ay vardır. Işık okları sağa yönelir. Gölgeler çizilmemiştir.</desc><rect width="920" height="700" fill="#FFFDF8"/><text x="70" y="198" text-anchor="middle" fill="#201951" font-size="40" font-family="Arial,sans-serif">K</text><circle cx="230" cy="190" r="62" fill="#E8B861" data-row="K" data-body="Güneş"/><text x="230" y="300" text-anchor="middle" fill="#201951" font-size="34" font-family="Arial,sans-serif">Güneş</text><circle cx="500" cy="190" r="24" fill="#BDB2DD" data-row="K" data-body="Ay"/><text x="500" y="300" text-anchor="middle" fill="#201951" font-size="34" font-family="Arial,sans-serif">Ay</text><circle cx="770" cy="190" r="43" fill="#52BFA8" data-row="K" data-body="Dünya"/><text x="770" y="300" text-anchor="middle" fill="#201951" font-size="34" font-family="Arial,sans-serif">Dünya</text><path data-light="K" d="M 325 190 H 405 M 389 180 L 405 190 L 389 200" fill="none" stroke="#201951" stroke-width="4"/><text x="70" y="488" text-anchor="middle" fill="#201951" font-size="40" font-family="Arial,sans-serif">L</text><circle cx="230" cy="480" r="62" fill="#E8B861" data-row="L" data-body="Güneş"/><text x="230" y="590" text-anchor="middle" fill="#201951" font-size="34" font-family="Arial,sans-serif">Güneş</text><circle cx="500" cy="480" r="43" fill="#52BFA8" data-row="L" data-body="Dünya"/><text x="500" y="590" text-anchor="middle" fill="#201951" font-size="34" font-family="Arial,sans-serif">Dünya</text><circle cx="770" cy="480" r="24" fill="#BDB2DD" data-row="L" data-body="Ay"/><text x="770" y="590" text-anchor="middle" fill="#201951" font-size="34" font-family="Arial,sans-serif">Ay</text><path data-light="L" d="M 325 480 H 405 M 389 470 L 405 480 L 389 490" fill="none" stroke="#201951" stroke-width="4"/><text x="460" y="660" text-anchor="middle" fill="#201951" font-size="27" font-family="Arial,sans-serif">Yalnız sıralama modeli · Ölçekli değildir</text></svg>
