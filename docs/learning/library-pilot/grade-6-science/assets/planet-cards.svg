<svg xmlns="http://www.w3.org/2000/svg" width="640" height="665" viewBox="0 0 640 665" role="img"><title>Gezegen araştırma panosu</title><desc>Güneş’e yakınlık sırasıyla: Merkür K halkası yok, Venüs K halkası yok, Dünya K halkası yok, Mars K halkası yok, Jüpiter G halkası var, Satürn G halkası var, Uranüs B halkası var, Neptün B halkası var.</desc><rect width="640" height="665" fill="#FFFDF8"/><rect x="15" y="20" width="610" height="66" rx="12" fill="#EBE5FA"/><text x="190" y="64" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Sıra / gezegen</text><text x="415" y="64" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Yapı</text><text x="555" y="64" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Halka</text><rect x="15" y="90" width="610" height="66" rx="12" fill="#F2F8F4"/><text x="190" y="134" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">1. Merkür</text><text x="415" y="134" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">K</text><text x="555" y="134" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Yok</text><rect x="15" y="160" width="610" height="66" rx="12" fill="#FFFFFF"/><text x="190" y="204" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">2. Venüs</text><text x="415" y="204" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">K</text><text x="555" y="204" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Yok</text><rect x="15" y="230" width="610" height="66" rx="12" fill="#F2F8F4"/><text x="190" y="274" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">3. Dünya</text><text x="415" y="274" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">K</text><text x="555" y="274" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Yok</text><rect x="15" y="300" width="610" height="66" rx="12" fill="#FFFFFF"/><text x="190" y="344" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">4. Mars</text><text x="415" y="344" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">K</text><text x="555" y="344" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Yok</text><rect x="15" y="370" width="610" height="66" rx="12" fill="#F2F8F4"/><text x="190" y="414" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">5. Jüpiter</text><text x="415" y="414" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">G</text><text x="555" y="414" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Var</text><rect x="15" y="440" width="610" height="66" rx="12" fill="#FFFFFF"/><text x="190" y="484" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">6. Satürn</text><text x="415" y="484" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">G</text><text x="555" y="484" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Var</text><rect x="15" y="510" width="610" height="66" rx="12" fill="#F2F8F4"/><text x="190" y="554" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">7. Uranüs</text><text x="415" y="554" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">B</text><text x="555" y="554" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">Var</text><rect x="15" y="580" width="610" height="66" rx="12" fill="#FFFFFF"/><text x="190" y="624" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">8. Neptün</text><text x="415" y="624" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,