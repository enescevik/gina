<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img"><title>Atölyedeki arabalar</title><desc>K arabasına 7 N doğuya ve 3 N batıya; L arabasına 5 N doğuya ve 5 N batıya; M arabasına 2 N doğuya ve 6 N doğuya kuvvet uygulanır. Doğu sağ, batı soldur.</desc><rect width="900" height="700" fill="#FFFDF8"/><text x="110" y="42" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Batı ←</text><text x="790" y="42" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">→ Doğu</text><text x="65" y="158" text-anchor="middle" fill="#201951" font-size="40" font-family="Arial,sans-serif">K</text><rect x="380" y="103" width="140" height="110" rx="16" fill="#EBE5FA" stroke="#6442DA" stroke-width="3"/><path data-force="K-0" data-newtons="7" d="M 450 130 L 716 130 M 700 120 L 716 130 L 700 140" fill="none" stroke="#6442DA" stroke-width="5"/><text x="770" y="140" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">7 N</text><path data-force="K-1" data-newtons="-3" d="M 450 180 L 336 180 M 352 170 L 336 180 L 352 190" fill="none" stroke="#201951" stroke-width="5"/><text x="282" y="190" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">3 N</text><text x="65" y="343" text-anchor="middle" fill="#201951" font-size="40" font-family="Arial,sans-serif">L</text><rect x="380" y="288" width="140" height="110" rx="16" fill="#EBE5FA" stroke="#6442DA" stroke-width="3"/><path data-force="L-0" data-newtons="5" d="M 450 315 L 640 315 M 624 305 L 640 315 L 624 325" fill="none" stroke="#6442DA" stroke-width="5"/><text x="694" y="325" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">5 N</text><path data-force="L-1" data-newtons="-5" d="M 450 365 L 260 365 M 276 355 L 260 365 L 276 375" fill="none" stroke="#201951" stroke-width="5"/><text x="206" y="375" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">5 N</text><text x="65" y="528" text-anchor="middle" fill="#201951" font-size="40" font-family="Arial,sans-serif">M</text><rect x="380" y="473" width="140" height="110" rx="16" fill="#EBE5FA" stroke="#6442DA" stroke-width="3"/><path data-force="M-0" data-newtons="2" d="M 450 500 L 526 500 M 510 490 L 526 500 L 510 510" fill="none" stroke="#6442DA" stroke-width="5"/><text x="580" y="510" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">2 N</text><path data-force="M-1" data-newtons="6" d="M 450 550 L 678 550 M 662 540 L 678 550 L 662 560" fill="none" stroke="#201951" stroke-width="5"/><text x="732" y="560" text-anchor="middle" fill="#201951" font-size="32" font-family="Arial,sans-serif">6 N</text><text x="450" y="660" text-anchor="middle" fill="#201951" font-size="25" font-family="Arial,sans-serif">Oklar okunabilirlik için aralıklı gösterilmiştir.</text></svg>
