<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" role="img"><title>Kurgusal okuma kaydı</title><desc>Sıfır kitap bitiren 1 kişi, bir kitap bitiren 3 kişi, iki kitap bitiren 4 kişi, üç kitap bitiren 2 kişi vardır.</desc><rect width="700" height="560" fill="#FFFDF8"/><path d="M 50 410 H 650" stroke="#201951" stroke-width="3" fill="none"/><text x="100" y="457" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">0</text><circle cx="100" cy="370" r="21" fill="#6442DA" data-value="0" data-level="0"/><text x="260" y="457" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">1</text><circle cx="260" cy="370" r="21" fill="#6442DA" data-value="1" data-level="0"/><circle cx="260" cy="305" r="21" fill="#6442DA" data-value="1" data-level="1"/><circle cx="260" cy="240" r="21" fill="#6442DA" data-value="1" data-level="2"/><text x="420" y="457" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">2</text><circle cx="420" cy="370" r="21" fill="#6442DA" data-value="2" data-level="0"/><circle cx="420" cy="305" r="21" fill="#6442DA" data-value="2" data-level="1"/><circle cx="420" cy="240" r="21" fill="#6442DA" data-value="2" data-level="2"/><circle cx="420" cy="175" r="21" fill="#6442DA" data-value="2" data-level="3"/><text x="580" y="457" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">3</text><circle cx="580" cy="370" r="21" fill="#6442DA" data-value="3" data-level="0"/><circle cx="580" cy="305" r="21" fill="#6442DA" data-value="3" data-level="1"/><text x="350" y="520" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">Bitirilen kitap sayısı</text><text x="350" y="65" text-anchor="middle" fill="#201951" font-size="34" font-family="Arial,sans-serif">Her nokta bir kişi</text></svg>
