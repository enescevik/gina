<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>İki yürüyüş rotası</title><desc>Mor rotanın başlangıç-köprü bölümü 1,2 kilometre, köprü-bitiş bölümü 350 metredir. Mint rotanın toplamı 1,6 kilometredir.</desc><rect width="1000" height="600" fill="#FFFDF8"/><path d="M 120 300 L 470 130 L 870 300" fill="none" stroke="#6442DA" stroke-width="9"/><path d="M 120 300 Q 490 640 870 300" fill="none" stroke="#52BFA8" stroke-width="9"/><circle cx="120" cy="300" r="12" fill="#201951" /><text x="120" y="265" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Başlangıç</text><circle cx="470" cy="130" r="12" fill="#201951" /><text x="470" y="95" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Köprü</text><circle cx="870" cy="300" r="12" fill="#201951" /><text x="870" y="265" text-anchor="middle" fill="#201951" font-size="30" font-family="Arial,sans-serif">Bitiş</text><text x="270" y="170" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">1,2 km</text><text x="700" y="165" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">350 m</text><text x="490" y="420" text-anchor="middle" fill="#201951" font-size="38" font-family="Arial,sans-serif">1,6 km</text><text x="500" y="550" text-anchor="middle" fill="#201951" font-size="26" font-family="Arial,sans-serif">Ölçeksiz şema · Uzunluklar etiketlerde</text></svg>
