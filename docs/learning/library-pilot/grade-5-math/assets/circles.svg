<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>Çemberlerden üçgene</title><desc>A merkezi solda, B merkezi sağda; AB 6 birim. Her iki çemberin yarıçapı 5 birim. C üst, D alt kesişim noktası. ABC üçgeni çizili.</desc><rect width="1200" height="820" fill="#FFFDF8"/><circle cx="432" cy="410" r="280" fill="none" stroke="#6442DA" stroke-width="4"/><circle cx="768" cy="410" r="280" fill="none" stroke="#218574" stroke-width="4"/><polyline id="triangle" points="432,410 768,410 600,186 432,410" fill="none" stroke="#201951" stroke-width="4"/><circle cx="432" cy="410" r="6" fill="#201951"/><text x="432" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">A</text><circle cx="768" cy="410" r="6" fill="#201951"/><text x="768" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">B</text><circle cx="600" cy="186" r="6" fill="#201951"/><text x="600" y="166" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">C</text><circle cx="600" cy="634" r="6" fill="#201951"/><text x="600" y="689" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">D</text><text x="600" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">6</text><text x="600" y="55" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="40" text-anchor="middle">A çemberi: r = 5 birim     B çemberi: r = 5 birim</text></svg>
