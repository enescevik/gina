<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>Eşit uzaklık denemesi</title><desc>A soldaki, B sağdaki merkez. AB 5 birim; A çemberinin yarıçapı 5, B çemberinin yarıçapı 5. Üst kesişim C, alt kesişim D. ABC üçgeni çizili.</desc><rect width="1200" height="820" fill="#FFFDF8"/><circle cx="460" cy="410" r="280" fill="none" stroke="#6442DA" stroke-width="4"/><circle cx="740" cy="410" r="280" fill="none" stroke="#218574" stroke-width="4"/><polyline id="triangle" points="460,410 740,410 600,167.51288694035716 460,410" fill="none" stroke="#201951" stroke-width="4"/><circle cx="460" cy="410" r="6" fill="#201951"/><text x="460" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">A</text><circle cx="740" cy="410" r="6" fill="#201951"/><text x="740" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">B</text><circle cx="600" cy="167.51288694035716" r="6" fill="#201951"/><text x="600" y="147.51288694035716" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">C</text><circle cx="600" cy="652.4871130596429" r="6" fill="#201951"/><text x="600" y="707.4871130596429" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">D</text><text x="600" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">5</text><text x="600" y="55" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="40" text-anchor="middle">A çemberi: r = 5 birim     B çemberi: r = 5 birim</text></svg>
