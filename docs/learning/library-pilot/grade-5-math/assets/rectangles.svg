<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>İki pencere modeli</title><desc>Kare ABCD ve yatay dikdörtgen EFGH. Köşeler her şeklin sol üstünden başlayarak saat yönünde sıralı. Karede tüm kenarlar 4; dikdörtgende EF ve GH 7, FG ve HE 4 birim.</desc><rect width="1200" height="720" fill="#FFFDF8"/><polygon points="90,220 350,220 350,480 90,480" fill="#F0EBFA" stroke="#6442DA" stroke-width="4" stroke-linejoin="round"/><polygon points="600,220 1055,220 1055,480 600,480" fill="#F0EBFA" stroke="#6442DA" stroke-width="4" stroke-linejoin="round"/><text x="70" y="200" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">A</text><text x="370" y="200" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">B</text><text x="370" y="516" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">C</text><text x="70" y="516" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">D</text><text x="580" y="200" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">E</text><text x="1075" y="200" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">F</text><text x="1075" y="516" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">G</text><text x="580" y="516" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">H</text><text x="220" y="190" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">4</text><text x="220" y="525" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">4</text><text x="52" y="350" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">4</text><text x="388" y="350" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">4</text><text x="827.5" y="190" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">7</text><text x="827.5" y="525" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">7</text><text x="562" y="350" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">4</text><text x="1093" y="350" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">4</text><text x="600" y="640" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="30" text-anchor="middle">Her iki modelin bütün iç açıları 90°.</text></svg>
