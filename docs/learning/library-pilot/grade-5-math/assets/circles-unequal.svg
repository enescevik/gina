<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>Farklı yarıçap denemesi</title><desc>A soldaki, B sağdaki merkez. AB 5 birim; A çemberinin yarıçapı 4, B çemberinin yarıçapı 6. Üst kesişim C, alt kesişim D. ABC üçgeni çizili.</desc><rect width="1200" height="820" fill="#FFFDF8"/><circle cx="436.66666666666663" cy="410" r="186.66666666666666" fill="none" stroke="#6442DA" stroke-width="4"/><circle cx="670" cy="410" r="280" fill="none" stroke="#218574" stroke-width="4"/><polyline id="triangle" points="436.66666666666663,410 670,410 459.99999999999994,224.79740822547865 436.66666666666663,410" fill="none" stroke="#201951" stroke-width="4"/><circle cx="436.66666666666663" cy="410" r="6" fill="#201951"/><text x="436.66666666666663" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">A</text><circle cx="670" cy="410" r="6" fill="#201951"/><text x="670" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">B</text><circle cx="459.99999999999994" cy="224.79740822547865" r="6" fill="#201951"/><text x="459.99999999999994" y="204.79740822547865" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">C</text><circle cx="459.99999999999994" cy="595.2025917745214" r="6" fill="#201951"/><text x="459.99999999999994" y="650.2025917745214" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">D</text><text x="553.3333333333333" y="465" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">5</text><text x="600" y="55" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="40" text-anchor="middle">A çemberi: r = 4 birim     B çemberi: r = 6 birim</text></svg>
