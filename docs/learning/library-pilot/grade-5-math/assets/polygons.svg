<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>Şekil atölyesi</title><desc>A üç doğru parçasından oluşan, sol alt ve sağ alt uçları açık bir yol. B kapalı üçgen. C çember. D kapalı, dış bükey beşgen.</desc><rect width="1200" height="800" fill="#FFFDF8"/><polyline points="100,280 100,120 400,120 400,280" fill="none" stroke="#6442DA" stroke-width="4" stroke-linejoin="round"/><text x="250" y="335" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">A</text><polygon points="710,280 910,90 1080,280" fill="#F0EBFA" stroke="#6442DA" stroke-width="4" stroke-linejoin="round"/><text x="900" y="335" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">B</text><circle cx="250" cy="555" r="130" fill="none" stroke="#6442DA" stroke-width="4"/><text x="250" y="740" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">C</text><polygon points="900,410 1060,515 1000,680 800,680 740,515" fill="#F0EBFA" stroke="#6442DA" stroke-width="4" stroke-linejoin="round"/><text x="900" y="740" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">D</text></svg>
