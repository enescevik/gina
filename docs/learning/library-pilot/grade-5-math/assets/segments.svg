<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>İki çizim</title><desc>AB çiziminde iki uç nokta var. CD çiziminde başlangıç C; D üzerinden sağa uzanan ok var.</desc><rect width="1200" height="430" fill="#FFFDF8"/><line x1="170" y1="280" x2="500" y2="280" stroke="#201951" stroke-width="4" stroke-linecap="round"/><circle cx="170" cy="280" r="6" fill="#201951"/><circle cx="500" cy="280" r="6" fill="#201951"/><text x="170" y="245" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">A</text><text x="500" y="245" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">B</text><line x1="660" y1="280" x2="1070" y2="280" stroke="#201951" stroke-width="4" stroke-linecap="round"/><circle cx="660" cy="280" r="6" fill="#201951"/><circle cx="900" cy="280" r="6" fill="#201951"/><polygon points="1070,280 1050,271 1050,289" fill="#201951"/><text x="660" y="245" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">C</text><text x="900" y="245" fill="#201951" font-family="Arial, sans-serif" stroke="#FFFDF8" stroke-width="6" paint-order="stroke fill" font-size="42" text-anchor="middle">D</text></svg>
