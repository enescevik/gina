<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>Üç küre seçimi</title><desc>A büyük sarı, B orta boy mint, C küçük mor bir küre olarak çizilmiş; her kürenin altında harfi var.</desc><rect width="1200" height="430" fill="#FFFDF8"/><circle cx="250" cy="190" r="115" fill="#E8B861" data-size="A"/><text x="250" y="345" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">A</text><circle cx="620" cy="190" r="60" fill="#52BFA8" data-size="B"/><text x="620" y="345" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">B</text><circle cx="950" cy="190" r="35" fill="#BDB2DD" data-size="C"/><text x="950" y="345" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">C</text></svg>
