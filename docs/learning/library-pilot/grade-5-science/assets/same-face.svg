<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İşaretli küre modeli</title><desc>Dünya çevresinde dört Ay modeli var. Her konumda yüzeydeki mor nokta Dünya’ya dönük. Nokta 1’de aşağıya, 2’de sağa, 3’te yukarıya, 4’te sola yöneliyor.</desc><rect width="1200" height="780" fill="#FFFDF8"/><circle cx="600" cy="370" r="240" fill="none" stroke="#BDB2DD" stroke-width="3" stroke-dasharray="9 9"/><circle cx="600" cy="370" r="65" fill="#52BFA8" /><text x="600" y="382" text-anchor="middle" fill="#201951" font-size="26" font-family="Arial,sans-serif">Dünya</text><circle cx="600" cy="130" r="48" fill="#EBE5FA" stroke="#6442DA" stroke-width="3"/><circle cx="600" cy="158" r="9" fill="#6442DA" data-marker="1"/><text x="700" y="140" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">1</text><circle cx="360" cy="370" r="48" fill="#EBE5FA" stroke="#6442DA" stroke-width="3"/><circle cx="388" cy="370" r="9" fill="#6442DA" data-marker="2"/><text x="270" y="380" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">2</text><circle cx="600" cy="610" r="48" fill="#EBE5FA" stroke="#6442DA" stroke-width="3"/><circle cx="600" cy="582" r="9" fill="#6442DA" data-marker="3"/><text x="700" y="620" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">3</text><circle cx="840" cy="370" r="48" fill="#EBE5FA" stroke="#6442DA" stroke-width="3"/><circle cx="812" cy="370" r="9" fill="#6442DA" data-marker="4"/><text x="930" y="380" text-anchor="middle" fill="#201951" font-size="36" font-family="Arial,sans-serif">4</text><text x="600" y="735" text-anchor="middle" fill="#201951" font-size="28" font-family="Arial,sans-serif">Şema: aynı yüzey işareti Dünya’ya dönük</text></svg>
