</style></head><body><div class="page"><header class="top"><button class="back" aria-label="Önceki adım" onclick="previous()">‹</button><img class="logo" src="/packages/assets/brand/growing-friend/logo.png" alt="gina"><span class="top-title">Prova hazırla</span><span class="saved">✓ Örnek taslak</span></header><div class="intro"><div><h1 id="heading"></h1><p id="subtitle"></p></div><span class="chip">Emre · 5. sınıf</span></div><nav class="steps" aria-label="Hazırlama adımları"></nav><div class="layout"><main id="main"></main><aside class="aside" id="aside"></aside></div></div><footer class="footer"><div class="footer-inner"><button class="edit" onclick="saveDraft()">Taslağı sakla</button><span class="footer-hint">Tasarım maketi · örnek veriler · gerçek kayıt oluşturmaz</span><button class="primary" id="next" onclick="next()"></button></div></footer><div id="overlay"></div><script>
const names=['Başlangıç','Kapsam','Sorular','Kontrol'];const titles=['Emre için nasıl bir Prova?','İşlediği konulardan başlayalım','Soruları bir araya getir','Çocuğun gözüyle son kontrol'];const subtitles=['Önce amacını seç. Ayrıntıları sonra düzenleyebilirsin.','Sınıfı ve dersleri profilden aldık; kontrol sende.','Farklı kaynaklar, tek Prova. Sırayı sen belirle.','Soruları gör, kapsamı kontrol et; hazırsa paylaş.'];
let step=Math.max(1,Math.min(4,Number(new URLSearchParams(location.search).get('step'))||1));let draft={purpose:'Yazılıya hazırlık',mixed:false,subjects:['Matematik'],count:10,duration:'Süresiz',selectedTopics:['Doğal sayılar','Kesirler'],extra:0};try{const stored=sessionStorage.getItem('gina-prova-design');if(stored)draft={...draft,...JSON.parse(stored)}}catch{};
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function keep(){try{sessionStorage.setItem('gina-prova-design',JSON.stringify(draft))}catch{}}
function setStep(n){step=n;history.replaceState({},'',`?step=${n}`);render();scrollTo(0,0)}function previous(){if(step>1)setStep(step-1);else toast('Ana ekran onaylı; bu maket hazırlama adımlarını gösteriyor.')}function next(){if(step===2&&draft.format==='meb'){toast('Önce uygun ve doğrulanmış dağılım seçilmeli.');return}if(step===4&&6+draft.extra<draft.count){toast('Hedef soru sayısı tamamlanmalı veya kapsamdan düzenlenmeli.');return}if(step<4)setStep(step+1);else toast('Örnek gönderim tamamlandı. Bu maket çocuğa veri göndermez.')}function saveDraft(){keep();toast('Örnek seçimler bu sekmede saklandı.')}function toast(s){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),4200)}
function pickPurpose(v){draft.purpose=v;keep();render()}function pickMode(m){draft.mixed=m;if(!m)draft.subjects=[draft.subjects[0]||'Matematik'];keep();render()}function subject(v){if(draft.mixed){if(draft.subjects.includes(v)){if(draft.subjects.length>1)draft.subjects=draft.subjects.filter(x=>x!==v)}else draft.subjects.push(v)}else draft.subjects=[v];keep();render()}function count(d){draft.count=Math.min(40,Math.max(3,draft.count+d));keep();render()}
function summary(){return `<h2>Prova’nın özeti</h2><div class="summary-row"><span>Çocuk</span><b>Emre · 5. sınıf</b></div><div class="summary-row"><span>Amaç</span><b>${escapeHtml(draft.purpose)}</b></div><div class="summary-row"><span>Ders</span><b>${draft.subjects.map(escapeHtml).join(', ')}</b></div><div class="summary-row"><span>Uzunluk</span><b>${draft.count} soru · ${escapeHtml(draft.duration)}</b></div><div class="notice">Sınıf uygunluğu, işlenen konular ve soru türü birlikte kontrol edilecek.</div><div class="mascot"><img src="/packages/assets/brand/growing-friend/reading.png" alt=""><p>Birlikte düşünmek için küçük bir başlangıç.</p></div>`}
function render(){document.querySelector('#heading').textContent=titles[step-1];document.querySelector('#subtitle').textContent=subtitles[step-1];document.querySelector('.steps').innerHTML=names.map((n,i)=>`<button class="${i+1===step?'active':''}" aria-current="${i+1===step?'step':'false'}" onclick="setStep(${i+1})"><b>${i+1<step?'✓':i+1}</b>${n}</button>`).join('');document.querySelector('#next').textContent=step===4?'Emre’ye gönder':step===3?'Önizle ve kontrol et':step===2?'Sorulara geç':'Kapsamı belirle';document.querySelector('#next').disabled=(step===2&&draft.format==='meb')||(step===4&&6+draft.extra<draft.count);document.querySelector('#aside').innerHTML=summary();document.querySelector('#main').innerHTML=[null,start,scope,questions,review][step]();}
function start(){return `<div class="panel"><div class="section"><span class="label">Kimin için?</span><div class="child"><span class="avatar">E</span><div><h3>Emre</h3><p class="sub">5. sınıf · Türkçe</p></div><button class="edit" style="margin-left:auto" onclick="profile()">Düzenle</button></div><p class="note">Tek çocuk olduğu için Emre’yi seçtik.</p></div><div class="section"><span class="label">Neye hazırlansın?</span><div class="choices purpose">${[['Konu çalışması','Yeni öğrendiklerini pekiştirir.'],['Yazılıya hazırlık','İşlediği konuları birlikte gözden geçirir.'],['Deneme','Farklı konuları bir arada dener.']].map(([p,h])=>`<button class="choice ${draft.purpose===p?'active':''}" aria-pressed="${draft.purpose===p}" onclick="pickPurpose('${p}')"><strong>${p}</strong><span class="sub">${h}</span></button>`).join('')}</div></div><div class="section"><span class="label">Tek ders mi, karma mı?</span><div class="choices"><button class="choice ${!draft.mixed?'active':''}" onclick="pickMode(false)">Tek ders</button><button class="choice ${draft.mixed?'active':''}" onclick="pickMode(true)">Karma Prova</button></div><div class="choices" style="margin-top:12px">${['Matematik','Türkçe','Fen Bilimleri','Sosyal Bilgiler'].map(s=>`<button class="choice ${draft.subjects.includes(s)?'active':''}" aria-pressed="${draft.subjects.includes(s)}" onclick="subject('${s}')">${s}</button>`).join('')}</div></div></div>`}
function scope(){return `<div class="panel"><div class="fields"><div class="field"><label for="term">Eğitim dönemi</label><select id="term"><option>2026–2027 · 1. dönem</option><option>2026–2027 · 2. dönem</option></select></div><div class="field"><label for="format">Hazırlık biçimi</label><select id="format" onchange="draft.format=this.value;keep();render()"><option value="general" ${draft.format!=='meb'&&draft.format!=='practice'?'selected':''}>Okul yazılısı</option><option value="meb" ${draft.format==='meb'?'selected':''}>MEB ortak yazılı</option><option value="practice" ${draft.format==='practice'?'selected':''}>Serbest alıştırma</option></select></div></div><p id="format-note" class="note">${draft.format==='meb'?'Bu örnek profilde doğrulanmış MEB dağılımı seçili değil. Uygun senaryo seçilene kadar devam edilemez.':'Okulda işlenen konuları aşağıdan seç.'}</p><div class="section"><span class="label">${escapeHtml(draft.subjects[0])} · işlenen konular</span><div class="checks">${['Doğal sayılar','Kesirler','Geometrik şekiller'].map((v,i)=>`<label><input type="checkbox" ${draft.selectedTopics.includes(v)?'checked':''} onchange="draft.selectedTopics=this.checked?[...draft.selectedTopics,'${v}']:draft.selectedTopics.filter(x=>x!=='${v}');keep()"><span>${v}</span><span class="sub" style="margin-left:auto">${i===2?'Henüz seçilmedi':'Seçili'}</span></label>`).join('')}</div><p class="note">Örnek konu listesi. Uygulamada doğrulanmış müfredat kataloğu kullanılacak.</p></div><hr class="divider"><div class="fields"><div class="field"><label>Soru sayısı</label><div class="stepper"><button aria-label="Soru sayısını azalt" onclick="count(-1)">−</button><output>${draft.count}</output><button aria-label="Soru sayısını artır" onclick="count(1)">+</button></div></div><div class="field"><label for="duration">Süre</label><select id="duration" onchange="draft.duration=this.value;keep();document.querySelector('#aside').innerHTML=summary()">${['Süresiz','15 dakika','20 dakika','30 dakika'].map(v=>`<option ${v===draft.duration?'selected':''}>${v}</option>`).join('')}</select></div></div><details class="advanced"><summary>Soru türü ve diğer seçenekler</summary><div class="fields"><div class="field"><label>Yanıt türü</label><select><option>Dengeli: şıklı ve açık uçlu</option>Yalnız açık uçlu</option>Yalnız şıklı</option></select></div><div class="field"><label>Zorluk</label><select><option>Dengeli dağılım</option>Temel pekiştirme</option>Biraz zorlayıcı</option></select></div></div><label class="label" style="margin-top:16px">AI için ek isteğin (isteğe bağlı)</label><textarea placeholder="Örneğin: Birkaç soruda tren yolculuğu bağlamını kullan."></textarea><p class="note">Hikâye bağlamı ile MEB konu–soru dağılımı farklı seçimlerdir.</p></details></div>`}
function questions(){return `<div class="panel"><div class="list-head"><h2>Prova’daki sorular</h2><button class="secondary" onclick="sources()">＋ Soru ekle</button></div><p class="sub">${6+draft.extra} / ${draft.count} soru hazır · Emre · 5. sınıf</p><div class="sources"><span class="source">2 kütüphane</span><span class="source">1 AI</span><span class="source">3 senin eklediğin</span></div><div class="question"><span class="num">1</span><div class="content"><h3>Sayıları karşılaştırıyorum</h3><p>Matematik · şıklı · kütüphane</p></div><button class="question-action" aria-label="Birinci soruyu düzenle" onclick="questionMenu()">⋯</button></div><div class="question"><span class="num">2</span><div class="content"><h3>Kesirlerle paylaşım</h3><p>Matematik · açık uçlu · kütüphane</p></div><button class="question-action" aria-label="İkinci soruyu düzenle" onclick="questionMenu()">⋯</button></div><section class="group"><div class="group-head"><span class="group-icon">▧</span><div><h3>Okul bahçesi</h3><p class="sub">Ortak görsel · 3–5. sorular</p></div><button class="question-action" style="margin-left:auto" aria-label="Ortak soru grubunu düzenle" onclick="questionMenu(true)">⋯</button></div>${['Görseli yorumla','İşlemini açıkla','Sonucunu kontrol et'].map((n,i)=>`<div class="question"><span class="num">${i+3}</span><div class="content"><h3>${n}</h3></div></div>`).join('')}</section><div class="question"><span class="num">6</span><div class="content"><h3>Bir yolculuk problemi</h3><p>Matematik · açık uçlu · AI önerisinden seçildi</p></div><button class="question-action" aria-label="Altıncı soruyu düzenle" onclick="questionMenu()">⋯</button></div>${draft.extra?`<div class="question"><span class="num">7–${6+draft.extra}</span><div class="content"><h3>Seçtiğin yeni sorular</h3><p>Örnek ekleme · aynı Prova’da</p></div></div>`:''}<div class="welcome-source"><button class="edit" onclick="ai()">✧ Eksik soruları AI ile tamamla</button><p class="sub">Mevcut soruların korunur. Üretmeden önce kullanımını görürsün.</p></div></div>`}
function review(){return `<div class="panel"><div class="list-head"><h2>Çocuk gibi önizle</h2><span class="chip">2 / ${6+draft.extra}</span></div><div class="preview"><div class="preview-top"><b>Matematik</b><span>Açık uçlu örnek</span></div><div class="preview-body"><p>Bir çikolatanın 8 eşit parçasından 3’ü yeniyor. Kalan kısmı kesir olarak göster.</p><svg viewBox="0 0 360 140" aria-label="Sekiz eşit parçalı çikolata; üç parça yenmiş"><rect x="42" y="22" width="276" height="96" rx="12" fill="#eee8fa" stroke="#6042de" stroke-width="2"/><g fill="#b89680" stroke="#fffefa" stroke-width="4"><rect x="46" y="26" width="65" height="43" rx="6"/><rect x="115" y="26" width="65" height="43" rx="6"/><rect x="184" y="26" width="65" height="43" rx="6"/><rect x="253" y="26" width="61" height="43" rx="6"/><rect x="46" y="73" width="65" height="41" rx="6"/></g><g fill="none" stroke="#a89bbb" stroke-width="2" stroke-dasharray="4 4"><rect x="115" y="73" width="65" height="41" rx="6"/><rect x="184" y="73" width="65" height="41" rx="6"/><rect x="253" y="73" width="61" height="41" rx="6"/></g></svg><div class="answer">Çocuk burada yazar veya çizer.</div></div></div>${6+draft.extra<draft.count?`<div class="notice">${draft.count-6-draft.extra} soru eksik. Soruları tamamla veya hedef sayısını düzenle. <button class="edit" onclick="setStep(3)">Sorulara dön</button></div>`:''}<div class="review-lines"><span>Soru sırası ve ortak kaynaklar birlikte</span><span>Yanıt anahtarı çocukta bitişten sonra</span><span>Açık uçlu yanıtlar veli incelemesine gelir</span></div><div class="checks"><label><input type="checkbox"><span>Yazdığım sorulardan seçtiklerimi GINA’ya öner</span></label></div><p class="note">İsteğe bağlıdır. Çocuk yanıtları ve kişisel dosyalar paylaşılmaz. Sonraki adımda paylaşılacak soruları seçersin.</p></div>`}
function modal(title,body){document.querySelector('#overlay').innerHTML=`<div class="sheet-backdrop" role="presentation"><section class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="row between"><h2 style="margin:0">${title}</h2><button class="edit" aria-label="Kapat" onclick="closeSheet()">✕</button></div>${body}</section></div>`;document.querySelector('.sheet button')?.focus()}function closeSheet(){document.querySelector('#overlay').innerHTML=''}
function sources(){modal('Aynı Prova’ya soru ekle',[['✧','AI ile oluştur','Tamamını ya da eksik soruları hazırlat.','ai()'],['▤','Kütüphaneden seç','Birden çok soruyu birlikte ekle.','library()'],['✎','Kendim yazacağım','Tekil soru veya ortak metin/görsel grubu.','manual()'],['↥','Dosyadan veya fotoğraftan','Belgeyi incelet, önerileri seçerek ekle.','fileImport()']].map(([s,t,d,fn])=>`<button class="sheet-row" onclick="${fn}"><span class="symbol">${s}</span><span><b>${t}</b><small>${d}</small></span></button>`).join('')+'<p class="note">Tüm yollar aynı taslağa geri döner.</p>')}
function ai(){modal('AI ile eksikleri tamamla',`<p class="note">Emre · 5. sınıf · ${escapeHtml(draft.subjects.join(', '))}</p><div class="notice">${Math.max(0,draft.count-6-draft.extra)} soru önerisi hazırlanacak. Seçim yapmak yeniden hak harcamaz.</div><p class="note">Gerçek uygulamada üretim bedeli ve kalan hak sunucudan gösterilecek; bu maket AI çağrısı yapmaz.</p><div class="field compact-section"><label>Ek isteğin (isteğe bağlı)</label><textarea placeholder="Sorular günlük yaşamla bağlantılı olsun."></textarea></div><button class="primary" style="width:100%;margin-top:18px" onclick="aiResults()">Örnek önerileri göster</button>`)}
function aiResults(){modal('İstediklerini birlikte seç',`<p class="note">3 öneri · seçim için ek kullanım yok</p><div class="checks">${['Tren yolculuğu','Bahçede ölçüm','Alışverişte paylaşım'].map((v,i)=>`<label><input class="suggestion" type="checkbox" checked><span>${v}<br><small>Matematik · açık uçlu · örnek</small></span></label>`).join('')}</div><button class="primary" style="width:100%;margin-top:15px" onclick="draft.extra+=document.querySelectorAll('.suggestion:checked').length;keep();closeSheet();render();toast('Seçilen örnekler aynı taslağa eklendi.')">Seçilenleri Prova’ya ekle</button>`)}
function library(){modal('Kütüphaneden seç',`<p class="notice">Filtre: Emre’nin sınıfı ve seçtiğin dersler. Filtreyi değiştirmek açık bir işlem olacak.</p><div class="checks"><label><input checked class="suggestion" type="checkbox">Bir problemi farklı yollarla çöz</label><label><input class="suggestion" type="checkbox">Bir şekli yorumla</label></div><button class="primary" style="width:100%;margin-top:15px" onclick="draft.extra+=document.querySelectorAll('.suggestion:checked').length;keep();closeSheet();render()">Seçilenleri ekle</button>`)}
function manual(){modal('Nasıl bir soru ekleyelim?',`<button class="sheet-row" onclick="toast('Tekil soru düzenleyicisi aynı taslağa dönecek.')"><span class="symbol">1</span><span><b>Tek soru</b><small>Metin, görsel, çizim ve yanıt anahtarı.</small></span></button><button class="sheet-row" onclick="toast('Ortak kaynak ve alt sorular bu Prova’ya bir blok olarak eklenecek.')"><span class="symbol">▧</span><span><b>Ortak metin/görsele bağlı sorular</b><small>Bir kaynak, birden fazla soru; aynı sınav setinde.</small></span></button>`)}
function fileImport(){modal('Belgeden soru öner',`<p class="notice">Fotoğraf veya belge seç → AI’nın bulduklarını kontrol et → istediklerini Prova’ya ekle.</p><button class="secondary" style="width:100%;margin-top:18px" onclick="toast('Bu tasarım maketi dosya yüklemez.')">Fotoğraf veya dosya seç</button><p class="note">Kaynak belge ile soru ilişkisi korunur. Dosya seçmek otomatik paylaşım veya yayın anlamına gelmez.</p>`)}
function questionMenu(group=false){modal(group?'Ortak soru grubu':'Soru seçenekleri',`<p class="note">${group?'Metin/görsel ve ona bağlı sorular birlikte taşınır.':'Bu soru üzerinde yapmak istediğini seç.'}</p>${['Düzenle','Yukarı taşı','Aşağı taşı','AI ile başka bir öneri al','Prova’dan çıkar'].map(v=>`<button class="sheet-row" onclick="toast('Örnek kontrol: ${v}. Gerçek soru verisi değişmez.')">${v}</button>`).join('')}`)}
function profile(){modal('Emre’nin öğrenme bilgileri',`<div class="fields compact-section"><div class="field"><label>Sınıf</label><select><option>5. sınıf</option><option>4. sınıf</option><option>6. sınıf</option></select></div><div class="field"><label>Program</label><select><option>Türkiye · MEB</option><option>Başka program</option></select></div></div><p class="notice">Sınıf/program değişirse mevcut sorular yeniden kontrol edilecek. Uygun olmayan sorular sessizce silinmeyecek.</p><button class="primary" style="width:100%;margin-top:18px" onclick="closeSheet()">Bilgilere dön</button>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
</script></body></html>
