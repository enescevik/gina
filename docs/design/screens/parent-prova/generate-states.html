<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI ile soru üret durumlar · Gina v5</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#284b47;font:16px/1.5 system-ui}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:38px;letter-spacing:-1px;margin:8px 0}h2{font-size:26px;margin:0 0 12px}p{max-width:920px}a{color:#087f7d}nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 28px}nav a,.pill{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;background:#e1eee6;border:1px solid #bfcec2;border-radius:12px;text-decoration:none;font-weight:650}section{padding:26px 0;border-top:1px solid #d9d4c5}.views{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}.phone{width:273px;max-width:100%;border-radius:16px;box-shadow:0 10px 28px #725b2920}.tablet{width:min(900px,100%);border-radius:14px;box-shadow:0 10px 28px #725b2920}figure{margin:0}figcaption{padding:8px 0;color:#61756b;font-size:14px}.screen-links{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}.screen-links a{min-height:48px;display:flex;align-items:center}.route{font-family:monospace;font-size:14px;color:#6a7b70}.notice{border-left:3px solid #b08b4b;padding:6px 16px;color:#68736a}.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.sheet img{width:100%;border-radius:10px}.sheet.child{grid-template-columns:repeat(2,1fr)}.sheet h2{font-size:20px;margin:8px 0}.state-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.state-grid img{width:100%}a:focus-visible{outline:3px solid #087f7d;outline-offset:3px}@media(max-width:700px){main{padding:18px}h1{font-size:30px}.sheet,.sheet.child{grid-template-columns:1fr 1fr}.state-grid{gap:8px}.tablet{width:100%}.phone{width:100%;max-width:390px}}</style><main><h1>AI ile soru üret · Durumlar</h1><p>Türkçe arayüz referansı · 390 × 844 telefon</p><div class="state-grid"><figure><h2>Boş / başlangıç</h2><img src="generate-empty-phone.png" alt="Boş / başlangıç telefon"></figure><figure><h2>Yükleniyor</h2><img src="generate-loading-phone.png" alt="Yükleniyor telefon"></figure><figure><h2>Hata</h2><img src="generate-error-phone.png" alt="Hata telefon"></figure></div></main></html>
