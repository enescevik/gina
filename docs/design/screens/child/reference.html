<script>
const root='../../../../packages/assets/';const q=new URLSearchParams(location.search),screen=q.get('screen')||'week',state=q.get('state')||'default',tablet=q.get('size')==='tablet';
const titles={week:'Haftam',calendar:'Takvimim',goal:'Hedefini seç',collection:'Koleksiyonum','prova-index':'Prova','prova-exam':'Soru 3 / 10',pin:'Merhaba Ece!','room-preview':'Odamı düzenle'};
const img=(path,cls='art')=>`<img class="${cls}" src="${root+path}" alt="">`;const task=s=>img('icons/tasks/illustrated-v3/'+s+'.webp');const game=s=>img('gamification/illustrated-v3/'+s+'.webp');const room=s=>img('rooms/v2/'+s+'.webp');const btn=(s,secondary=false,disabled=false)=>`<button class="btn ${secondary?'secondary':''}" ${disabled?'disabled':''}>${s}</button>`;const pin=()=>img('room-chrome/png/pin-teal@3x.png','pin');
const paper=(s,cls='')=>`<section class="paper ${cls}">${s}</section>`;const status=(s,c='')=>`<span class="status ${c}">${s}</span>`;
const row=(icon,title,detail,extra='')=>`<div class="row task">${icon}<div class="grow"><h3>${title}</h3><p class="meta">${detail}</p></div>${extra}</div>`;
function week(){return paper(`${pin()}<h2>26 Ekim – 1 Kasım</h2><div class="days">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map((d,i)=>`<div class="day ${i===4?'today':''}">${d}<b>${26+i>31?1:26+i}</b></div>`).join('')}</div><p class="meta">Günlük görevlerin ve onay durumları</p>`,'pinned')+['26 Ekim Pazartesi','27 Ekim Salı','28 Ekim Çarşamba','29 Ekim Perşembe','30 Ekim Cuma · Bugün','31 Ekim Cumartesi','1 Kasım Pazar'].map((d,i)=>paper(`<h2>${d}</h2>${i===0?row(task('read-book'),'20 dakika kitap oku','3 yıldız',status('Onaylandı'))+row(task('pack-school-bag'),'Çantanı hazırla','2 yıldız',status('Onay bekliyor','wait')):i===1?row(task('brush-teeth'),'Dişlerini fırçala','2 yıldız',status('Bekliyor','todo'))+row(task('tidy-room'),'Odanı topla','2 yıldız',status('Bekliyor','todo')):'<p class="muted">Görev yok</p>'}`)).join('')+btn('Bugün',true)}
function calendar(){const data=[['30 Ekim Cuma · Bugün',[['school','Okul','08:30–15:30','Okul · Atatürk İlkokulu'],['activity','Yüzme','17:00–18:00','Aktivite · Spor merkezi']]],['31 Ekim Cumartesi',[['family','Ailece sinema','15:00–17:00','Aile etkinliği · Sinema']]],['1 Kasım Pazar',[]],['26 Ekim Pazartesi',[['school','Okul','08:30–15:30','Okul · Atatürk İlkokulu']]],['27 Ekim Salı',[['activity','Yüzme','17:00–18:00','Aktivite · Spor merkezi']]],['28 Ekim Çarşamba',[]],['29 Ekim Perşembe',[['holiday','Cumhuriyet Bayramı','Tüm gün','Tatil']]]];return paper('<h2>26 Ekim – 1 Kasım</h2><p class="meta">Bu haftaki dersler ve etkinlikler</p>')+data.sort((a,b)=>parseInt(a[0])===1?1:parseInt(b[0])===1?-1:parseInt(a[0])-parseInt(b[0])).map(([d,events])=>paper(`<h2>${d}</h2>${events.length?events.map(([icon,t,time,sub])=>row(img('icons/events/illustrated-v3/'+icon+'.webp'),t,time+'<br>'+sub)).join(''):'<p class="muted">Etkinlik yok</p>'}`)).join('')+btn('Bugün',true)}
function goal(){return `<div class="ticket"><h2>Bir sonraki hedefin</h2><p>Bir ödül seç; hedefin olsun.</p></div><div class="stack">`+[['reward-movie-night-left','Ailece sinema',20],['reward-book','Yeni bir kitap',30],['reward-park','Parkta bir gün',15],['reward-game-with-parent','Birlikte oyun',10]].sort((a,b)=>a[2]-b[2]).map(([s,t,n])=>`<button class="paper reward"><span class="row">${game(s)}<span class="grow"><h3>${t}</h3><span class="meta">Hedef olarak seç</span></span><span class="cost">${n} ${img('gamification/illustrated-v3/stars/star-filled.webp','')}</span></span></button>`).join('')+'</div>'+btn('Vazgeç',true)}
function collection(){return `<div class="hero-note"><h2>${state==='empty'?0:3} / 4 rozet kazandın</h2><p>Başardıkların burada birikiyor.</p></div><div class="grid">`+[['tooth-care','Diş Parlatan',true],['bookworm','Kitap Kurdu',true],['first-task','İlk Görev',true],['week-hero','25 Görev',false]].map(([s,t,won])=>{let earned=won&&state!=='empty';return `<div class="badge ${earned?'':'locked'}">${img('gamification/illustrated-v3/badges/badge-'+(earned?s:'locked')+'.webp')}<h3>${t}</h3><span class="status ${earned?'':'todo'}">${earned?'Kazanıldı':'Kilitli'}</span></div>`}).join('')+'</div>'+btn('Bugün',true)}
function prova(){return '<h2 class="section-title">Seni bekleyen denemeler</h2>'+paper(`${pin()}${row(task('homework-math'),'Matematik provası','10 soru · 15 dk')}<div class="actions">${btn('Başla')}</div>`,'pinned')+paper(`${row(task('read-book'),'Türkçe provası','8 soru · süresiz')}<div class="actions">${btn('Devam')}</div>`)+`<h2 class="section-title">Tamamlananlar</h2>`+paper(row(img('gamification/illustrated-v3/stamps/stamp-approved.webp'),'Hayat bilgisi','Şıklı: 6 / 8 doğru'))+btn('Bugün',true)}
function exam(){if(state==='result')return paper(`<div class="center">${img('gamification/illustrated-v3/stamps/stamp-approved.webp','success-art')}<h2>Deneme bitti!</h2><p class="question">Şıklı: 8 / 10 doğru</p><p>Açık uçlu cevaplarını ebeveynin inceleyecek.</p></div>`)+btn("Prova'ya dön");let open=state==='open';return `<div class="timer">Kalan süre 08:45</div>`+paper(`<p class="question">${open?'Bir bitkinin büyümesi için nelere ihtiyacı vardır? Kendi cümlelerinle yaz.':'Ece’nin 12 kalemi var. 4 kalemini Can’a veriyor. Ece’nin kaç kalemi kalır?'}</p>${open?'<textarea class="textarea" placeholder="Cevabını buraya yaz…"></textarea>':'<div class="answers">'+['6','8','10','16'].map((t,i)=>`<button class="answer ${i===1?'selected':''}"><b>${'ABCD'[i]}</b><span>${t}</span>${i===1?'<span class="check">✓</span>':''}</button>`).join('')+'</div>'}`)+ (state==='confirm'?`<div class="warn"><p><b>2 soru boş kaldı. Yine de bitirmek istiyor musun?</b></p><div class="actions">${btn('Boş soruya git',true)}${btn('Yine de bitir')}</div></div>`:'')+`<div class="actions">${btn('Geri',true)}${btn(state==='confirm'?'Bitir':'Sonraki')}</div>`}
function pinScreen(){return `<div class="pin-form">${img('rooms/v2/character-girl.webp','pin-hero')}`+paper(`<h2 class="center">PIN’ini gir</h2><label class="meta" for="pin">PIN</label><input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="4" value="${(state==='empty'||state==='error')?'':'1234'}">${state==='error'?'<p class="status" style="color:#b33b38">PIN yanlış, tekrar dene.</p>':''}${btn(state==='loading'?'Kontrol ediliyor…':'Tamam',false,state==='empty'||state==='error'||state==='loading')}${btn('Vazgeç',true)}`)+'</div>'}
function roomEdit(){let tab=state==='themes'?'Oda':state==='pets'?'Dostum':'Karakter';return `<div class="room-content"><div class="room-scene"><div class="room-canvas">${img('rooms/v2/character-girl.webp','room-person')}${img('rooms/v2/pet-cat.webp','room-pet')}</div></div><div class="segments">${['Karakter','Oda','Dostum'].map(t=>`<button class="${tab===t?'selected':''}">${t}</button>`).join('')}</div><h2>${tab==='Karakter'?'Karakterini seç':tab==='Oda'?'Odanın havası':'Odandaki dostun'}</h2><div class="pickgrid">${tab==='Karakter'?['unspecified','girl','boy'].map((s,i)=>`<button class="pick ${i===1?'selected':''}">${room('character-'+s)}<span>Karakter ${i+1}</span>${i===1?'<span class="tick">✓ Seçili</span>':''}</button>`).join(''):tab==='Oda'?[['sun','Güneşli'],['leaf','Doğa'],['orbit','Keşif']].map(([s,t],i)=>`<button class="pick ${!i?'selected':''}">${img('rooms/v2/room-base.webp','theme-art')}${img('rooms/v2/decor-'+s+'.svg','theme-mark')}<span>${t}</span>${!i?'<span class="tick">✓ Seçili</span>':''}</button>`).join(''):[['cat','Kedi'],['dog','Köpek'],['monkey','Maymun'],['lion','Aslan yavrusu'],['none','Dostum yok']].map(([s,t],i)=>`<button class="pick ${!i?'selected':''}">${s==='none'?'<span class="art" style="display:grid;place-items:center;font-size:36px">—</span>':room('pet-'+s+'-portrait')}<span>${t}</span>${!i?'<span class="tick">✓ Seçili</span>':''}</button>`).join('')}</div><p class="foot">Seçimini odanda önizle.</p>${btn('Bugün',true)}</div>`}
const empties={week:['Bu hafta görev yok','Görevler eklendiğinde burada görünecek.'],calendar:['Bu hafta etkinlik yok','Derslerin ve aile etkinliklerin burada görünecek.'],goal:['Henüz ödül tanımlı değil','Ebeveyninden eklemesini iste.'],collection:['Henüz rozet kazanmadın','Görevlerini yaptıkça kazandığın rozetler burada birikecek.'],'prova-index':['Şu an atanmış deneme yok','Bir deneme atandığında burada göreceksin.'],'prova-exam':['Soru bulunamadı','Bu deneme henüz hazır değil. Ebeveynine haber verebilirsin.'],'room-preview':['Odan hazır','Henüz seçimin yok. Varsayılan karakter ve oda gösterilir.']};
function states(){let [title,desc]=empties[screen]||['Henüz içerik yok',''];if(state==='loading')return paper(`<div class="emptystate">${img('gamification/illustrated-v3/loading/loading-star-static.webp')}<h2>Yükleniyor…</h2><p>Birazdan hazır.</p><div class="skeleton"></div><div class="skeleton short"></div><div class="skeleton"></div></div>`);if(state==='error')return paper(`<div class="emptystate">${room('parent-insight-book')}<h2>Bağlantı kurulamadı</h2><p>İnternet bağlantını kontrol et. Biraz sonra yeniden açabilirsin.</p>${screen==='prova-exam'?btn('Sonraki',false,true):btn(screen==='goal'?'Vazgeç':'Bugün',true)}</div>`);return paper(`<div class="emptystate">${room('parent-insight-book')}<h2>${title}</h2><p>${desc}</p>${screen==='prova-exam'?btn('Sonraki',false,true):btn(screen==='goal'?'Vazgeç':'Bugün',true)}</div>`)}
let fn={week,calendar,goal,collection,'prova-index':prova,'prova-exam':exam,pin:pinScreen,'room-preview':roomEdit}[screen];let html=screen==='pin'?fn():screen==='collection'&&state==='empty'?collection():screen==='room-preview'&&state==='empty'?'<p class="meta">Varsayılan oda ve karakterin gösteriliyor.</p>'+roomEdit():['empty','loading','error'].includes(state)?states():fn();
document.querySelector('#app').innerHTML=`<div class="frame ${tablet?'tablet':''}"><div class="safe"></div><header class="header"><button class="back" aria-label="Geri" ${screen==='prova-exam'?'style="display:none"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>${screen==='prova-exam'&&state==='result'?'Deneme bitti!':titles[screen]}</h1></header><div class="scroll"><div class="content">${html}</div></div><aside class="decor">${img('rooms/v2/character-girl.webp','person')}${img('rooms/v2/pet-cat.webp','pet')}</aside></div>`;
window.ready=(async()=>{await Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode())]);if(document.querySelector('.room-canvas')){let m=await(await fetch(root+'rooms/v2/manifest.json')).json();for(let [slug,cls] of [['character-girl','.room-person'],['pet-cat','.room-pet']]){let e=m.find(x=>x.slug===slug),b=e.contentBounds,k=Math.min(e.sceneFitBox.width/(b[2]-b[0]),e.sceneFitBox.height/(b[3]-b[1]));Object.assign(document.querySelector(cls).style,{left:(e.sceneAnchor.x-(b[0]+b[2])/2*k)/1586*100+'%',top:(e.sceneAnchor.y-b[3]*k)/992*100+'%',bottom:'auto',width:e.width*k/1586*100+'%',height:e.height*k/992*100+'%'})}}if(state==='confirm')document.querySelector('.scroll').scrollTop=document.querySelector('.scroll').scrollHeight;return true})();
</script></html>
